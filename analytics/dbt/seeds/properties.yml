version: 2

seeds:
  - name: com_epci_dep_reg
    config:
      delimiter: ";"
      column_types:
        com_code: varchar(5)
        com_siren: varchar(9)
        com_name: varchar(100)
        epci_siren: varchar(9)
        epci_name: varchar(100)
        dep_siren: varchar(9)
        dep_name: varchar(100)
        "reg_siren": varchar(100)
        ept_siren: varchar(9)
        ept_name: varchar(100)

      meta:
        header: true
        quote: '"'
        enable: true
  - name: taxe
    config:
      delimiter: ";"
      enabled: false

      meta:
        quote: '"'
        header: true
  - name: nature_juridique
    config:
      delimiter: ";"
      enabled: false

      meta:
        quote: '"'
        header: true
  - name: departements_france
    config:
      delimiter: ","
      enabled: true

      meta:
        quote: '"'
        header: true
  - name: direction_territoriale
    config:
      delimiter: ";"

  - name: prenom
    config:
      delimiter: ","

  - name: tlv_cities
    config:
      delimiter: ";"
      meta:
        header: true
  - name: cog_20240101
    config:
      delimiter: ","
      meta:
        header: true
  - name: article_232_1
    config:
      meta:
        header: true
  - name: article_232_2
    config:
      meta:
        header: true
  - name: ngeo-anct-cog2023
    config:
      meta:
        header: true
  - name: opah
    config:
      delimiter: ","
      column_types:
        insee_code: varchar(5)
        code: varchar(9)
        nom: varchar(255)
        typeprogramme: varchar(50)
        datesignature: timestamp

      meta:
        header: true
        quote: '"'
        strict_mode: false
        null_padding: true
  - name: ort
    config:
      delimiter: ","
      column_types:
        "Si signée, date de signature": varchar(5)

      meta:
        header: true
  - name: table_appartenance_geo_communes_2024
    config:
      delimiter: ","
      column_types:
        CODGEO: varchar(5)
        UU2020: varchar(5)
        EPCI: varchar(9)
        UU_code: varchar(5)
        UU_name: varchar(255)
        EPCI_code: varchar(9)
        EPCI_name: varchar(255)

      meta:
        header: true
        quote: '"'
  - name: fusions
    description: "Fusions de communes"
    config:
      delimiter: ","
      meta:
        header: true
  - name: scissions
    config:
      delimiter: ","
      meta:
        header: true

  - name: lovac_public_criteria
    description: >
      Critère de vacance retenu pour le chiffre public
      (count_vacant_housing_private_fil_public), par millésime LOVAC.
      Les millésimes 2019-2024 croisent la vacance FIL avec le classement CCTHP
      des Fichiers Fonciers ; 2025 et suivants retiennent la vacance FIL seule,
      conformément à ce que l'import ZLV consomme réellement.
      Ajouter une ligne pour chaque nouveau millésime : sans elle, le chiffre
      public est NULL et le test
      tests/data_quality/test_morphology_public_criterion_declared.sql échoue.
      Voir docs/decisions/20260805142324-millesime-inclus-provenance-d-import-et-non-presence-lovac.md
    config:
      delimiter: ","
      column_types:
        year: integer
        public_criterion: varchar(9)

      meta:
        header: true
    columns:
      - name: year
        description: Millésime LOVAC.
        tests:
          - unique
          - not_null
      - name: public_criterion
        description: Critère appliqué pour ce millésime.
        tests:
          - not_null
          - accepted_values:
              values: ['fil', 'fil_ccthp']